id: 02-lru-cache
title: Implement an LRU cache class
category: code
prompt: |
  Implement the class `LRUCache` in lru.py (a stub exists). Interface:
  - `LRUCache(capacity)` creates a cache holding at most `capacity` entries (capacity >= 1).
  - `get(key)` returns the stored value, or None if the key is absent. A successful get marks the key as most recently used.
  - `put(key, value)` inserts or updates the key and marks it most recently used. If the cache would exceed its capacity,
    evict the least recently used entry.
  Use only the standard library. Keep the file name lru.py and the class name LRUCache.
grader:
  type: unit_tests
  tests: tests
limits:
  timeout_s: 240
  max_turns: 20
