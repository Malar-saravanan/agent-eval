id: 03-int-to-roman
title: Implement int_to_roman
category: code
prompt: |
  Implement the function `int_to_roman(n)` in roman.py (a stub exists). It converts an integer from 1 to 3999 to its
  standard Roman numeral string using subtractive notation (e.g. 4 -> "IV", 9 -> "IX", 1994 -> "MCMXCIV").
  Raise `ValueError` for integers outside 1..3999. Keep the file name roman.py and the function name int_to_roman.
grader:
  type: unit_tests
  tests: tests
limits:
  timeout_s: 240
  max_turns: 20
